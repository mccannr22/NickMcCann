<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="icon" type="image/x-icon" href="media/images/favicon_io/favicon.ico">
    <link rel="stylesheet" href="css/css/styles.css">
    <link rel="stylesheet" href="css/css/contactstyles.css">
</head>
<body>
    <!-- header with nav-->
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="menu.html">Menu</a></li>
            </ul>
        </nav>
    </header>
    <form action="thankyou.html">
            <div id="innerForm">
            <h1 id="heading">Send Us a Review!</h1>
            <label>Have you been with us before?</label>
            <input type="text" id="question">
            <br>
            <label>First Name: </label>
            <input type="text" id="fname">
            <br>
            <label>Last Name: </label>
            <input type="text" id="lname">
            <br>
            <p>Comments:</p>
            <textarea rows="4" cols="50" id="comment" placeholder="Please enter your comment."></textarea>
            <button type="reset">Clear</button>
            <button type="submit">Submit</button>
            </div>
    </form>
    <form action="thankyou.html">
            <div id="innerForm">
            <h1 id="heading">Order Now!</h1>
            <label>Do you have a rewards account?</label>
            <input type="text" id="question">
            <br>
            <label>First Name: </label>
            <input type="text" id="fname">
            <br>
            <label>Last Name: </label>
            <input type="text" id="lname">
            <br>
            <label>Address:</label>
            <input type="text" id="address">
            <br>
            <label>Phone Number:</label>
            <input type="text" id="phoneNumber">
            <p>Special Requests:</p>
            <textarea rows="4" cols="50" id="comment" placeholder="Please enter your pizza size and or toppings!"></textarea>
            <button type="reset">Clear</button>
            <button type="submit">Submit</button>
            </div>
    </form>
    <footer>
        <div id="col1">
            <h3>Social Media</h3>
            <img src="media/images/instagram.png" alt="Company's Instagram Link" width="100" height="100">
            <img src="media/images/tiktok.png" alt="Company's TikTok Link" width="100" height="100">
        </div>
        <div id="col2">
            <h3>Restaurant Hours</h3>
            <p>Everyday 10:00 am - 10:00 pm</p>
        </div>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
